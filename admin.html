<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b4d8f">
  <title>شهد | إدارة الشركات</title><link rel="icon" href="icon-192.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css?v=19">
  <style>
    body{font-family:"Cairo",sans-serif}.admin-page{min-height:100dvh;background:var(--bg);padding:20px}.admin-shell{max-width:1300px;margin:auto}.admin-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.admin-brand{display:flex;align-items:center;gap:10px}.admin-brand img{width:72px;height:54px;object-fit:contain;background:#fff;border:1px solid var(--border);border-radius:14px;padding:5px}.admin-brand h1{font-size:18px;margin:0}.admin-brand p{font-size:10px;color:var(--muted);margin:3px 0 0}.admin-grid{display:grid;grid-template-columns:360px 1fr;gap:16px}.admin-create{position:sticky;top:18px;align-self:start}.admin-form{padding:18px;display:grid;gap:12px}.admin-form .field{gap:5px}.duration-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.admin-list{display:grid;gap:10px}.company-admin-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow-soft)}.company-admin-head{display:flex;justify-content:space-between;gap:12px}.company-admin-card h3{font-size:15px;margin:0}.company-key{display:inline-flex;margin-top:5px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:4px 7px;font:700 11px monospace;direction:ltr}.company-admin-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.company-admin-meta div{background:var(--surface-2);border-radius:10px;padding:8px}.company-admin-meta small{display:block;font-size:8px;color:var(--muted)}.company-admin-meta strong{display:block;font-size:10px;margin-top:3px}.company-admin-actions{display:flex;gap:7px;flex-wrap:wrap}.admin-login{min-height:100dvh;display:grid;place-items:center;background:linear-gradient(145deg,#edf4fb,#f9fbfe);padding:18px}.admin-login-card{width:min(100%,420px);background:#fff;border:1px solid #e0e8f0;border-radius:24px;padding:22px;box-shadow:0 22px 60px rgba(20,44,76,.12)}.admin-login-card img{width:110px;display:block;margin:0 auto 10px}.admin-login-card h1{text-align:center;font-size:20px;margin:0}.admin-login-card p{text-align:center;color:#6b778c;font-size:10px}.admin-login-card form{display:grid;gap:12px;margin-top:18px}.admin-status{padding:9px;border-radius:10px;background:#fff0f2;color:#c52f42;font-size:10px;display:none}.admin-status.show{display:block}.admin-modal-backdrop{position:fixed;inset:0;background:rgba(5,20,36,.55);z-index:99;display:grid;place-items:center;padding:16px}.admin-modal{width:min(100%,480px);background:var(--surface);border-radius:20px;border:1px solid var(--border);padding:18px;box-shadow:var(--shadow)}.admin-modal h3{margin:0 0 12px}.admin-modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.admin-statbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.admin-stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:11px}.admin-stat small{font-size:8px;color:var(--muted)}.admin-stat strong{display:block;font-size:18px;margin-top:3px}.manager-login-line{margin-top:7px;font-size:10px;color:var(--muted)}.manager-login-line strong{color:var(--primary);font-family:monospace}.created-login-box{display:grid;gap:8px}.created-login-box>div{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px}.created-login-box small{display:block;color:var(--muted);font-size:9px;margin-bottom:3px}.created-login-box strong{display:block;font-size:13px}.created-login-box p{font-size:10px;line-height:1.8;color:var(--muted);margin:4px 0 0}
    @media(max-width:900px){.admin-page{padding:12px}.admin-grid{grid-template-columns:1fr}.admin-create{position:static}.company-admin-meta{grid-template-columns:1fr 1fr}.admin-statbar{grid-template-columns:1fr 1fr}.admin-top{align-items:flex-start}.admin-brand p{display:none}}
    @media(max-width:520px){.company-admin-actions{display:grid;grid-template-columns:1fr 1fr}.company-admin-actions .btn{width:100%}.duration-grid{grid-template-columns:1fr 1fr}.admin-brand img{width:58px;height:46px}.admin-brand h1{font-size:15px}.admin-form{grid-template-columns:1fr 1fr;gap:9px;padding:14px}.admin-form>.duration-grid,.admin-form>button{grid-column:1/-1}.admin-form .field{min-width:0}.admin-form .input,.admin-form .select{font-size:16px;padding:10px 8px}.admin-modal form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.admin-modal form>.duration-grid,.admin-modal form>.admin-modal-actions{grid-column:1/-1}.admin-modal .field{min-width:0}.admin-modal .input,.admin-modal .select{font-size:16px}}
  </style>
</head>
<body>
<section id="adminLogin" class="admin-login"><div class="admin-login-card"><img src="shahd-logo.jpg" alt="شهد"><h1>إدارة مفاتيح الشركات</h1><p>لوحة الأدمن العامة لإنشاء الشركات وإيقاف وتمديد المفاتيح.</p><form id="adminLoginForm"><label class="field"><span>مفتاح الأدمن الرئيسي</span><input class="input" name="adminKey" type="password" required autocomplete="current-password"></label><div id="adminLoginStatus" class="admin-status"></div><button class="btn btn-primary" type="submit">دخول لوحة الأدمن</button><a class="btn btn-ghost" href="index.html">العودة لتسجيل دخول الشركة</a></form></div></section>
<section id="adminApp" class="admin-page" hidden><div class="admin-shell"><header class="admin-top"><div class="admin-brand"><img src="shahd-logo.jpg"><div><h1>إدارة الشركات والمفاتيح</h1><p>مفاتيح متعددة الشركات مع مدة وحد المستخدمين</p></div></div><div style="display:flex;gap:7px"><button id="adminRefresh" class="btn btn-ghost">تحديث</button><button id="adminLogout" class="btn btn-danger-soft">خروج</button></div></header><div id="adminStats" class="admin-statbar"></div><div class="admin-grid"><article class="panel admin-create"><div class="panel-head"><div><h2>إنشاء شركة جديدة</h2><p>ينشأ المفتاح والمدير الأساسي دفعة واحدة.</p></div></div><form id="companyForm" class="admin-form"><label class="field"><span>اسم الشركة</span><input class="input" name="name" required></label><label class="field"><span>مفتاح الشركة (اتركه فارغاً للتوليد)</span><input class="input" name="companyKey" placeholder="SHD-XXXX-XXXX"></label><div class="duration-grid"><label class="field"><span>المدة</span><input class="input" name="durationQuantity" type="number" min="1" value="1" required></label><label class="field"><span>الوحدة</span><select class="select" name="durationUnit"><option value="hour">ساعة</option><option value="day">يوم</option><option value="month" selected>شهر</option><option value="year">سنة</option></select></label></div><label class="field"><span>الحد الأقصى للمستخدمين</span><input class="input" name="maxUsers" type="number" min="1" max="500" value="10"></label><label class="field"><span>اسم المدير</span><input class="input" name="managerName" value="مدير الشركة" required></label><label class="field"><span>اسم مستخدم المدير</span><input class="input" name="managerUsername" value="admin" required></label><label class="field"><span>كلمة مرور المدير</span><input class="input" name="managerPassword" type="password" minlength="6" required></label><button class="btn btn-primary" type="submit">إنشاء الشركة والمفتاح</button></form></article><section><div id="companiesList" class="admin-list"><div class="empty">جاري التحميل...</div></div></section></div></div></section>
<div id="adminModalRoot"></div><div id="toastRoot" class="toast-root"></div>
<script src="permissions.js?v=19"></script><script src="shahd-turso.js?v=19"></script><script src="admin.js?v=19"></script>
</body></html>
