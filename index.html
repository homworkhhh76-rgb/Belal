  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.3.0",
      "react-dom": "https://esm.sh/react-dom@19.3.0?external=react",

    }

  <script src="./oscar-activation-runtime.js?v=7.9.4.136-localization"></script>
  <script>
    try {
      const rt = window.OscarActivation?.readRuntime?.();
      const companyTitle = String(rt?.companyName || rt?.trialProfile?.companyName || '').trim();
      if (companyTitle) document.title = companyTitle;
    } catch (_) {}
  </script>
  <script src="./oscar-cloud-sync.js?v=7.9.4.136-localization"></script>
</head>
<body>
  <script>document.documentElement.classList.remove('dark');</script>
  <style>.ct-startup-screen{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;background:#fafbff;color:#1e293b;padding:24px;font-family:Cairo,Tahoma,sans-serif;box-sizing:border-box}.ct-startup-screen h2{font-size:26px;max-width:420px;margin:0}.ct-startup-screen p{color:#64748b}.ct-loading-ring{width:150px;height:150px;border:12px solid #e5e7eb;border-top-color:#7c3aed;border-radius:50%;display:grid;place-items:center;animation:ct-spin .55s linear infinite}.ct-loading-ring span{font-size:65px;color:#7c3aed}.ct-loading-status{padding:18px 25px;border-radius:18px;background:#ede9fe;color:#6d28d9}@keyframes ct-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.ct-loading-ring{animation:none}}</style><div id="root"><div class="ct-startup-screen" dir="rtl"><div class="ct-loading-ring" aria-label="جاري التشغيل"></div><div class="ct-loading-status" role="status">جاري تشغيل التطبيق…</div></div></div></div>
  <script type="module">
    const OSCAR_BUILD = '7.9.4.136-localization';
    const isLocal = ['localhost', '127.0.0.1', '::1'].includes(location.hostname);

    const clearCodeCaches = async () => {
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter((key) => key.startsWith('oscar-accounting-')).map((key) => caches.delete(key)));
        }
      } catch (_) {}
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
      } catch (_) {}
    };

    const showRecovery = () => {
      const root = document.getElementById('root');
      if (!root) return;
      root.innerHTML = '<div dir="rtl" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;font-family:Cairo,sans-serif;padding:24px"><div style="max-width:420px;width:100%;text-align:center;background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:24px"><div style="font-size:34px">🔄</div><div style="font-weight:900;color:#0f172a;margin-top:8px">إعادة تحميل واجهة النظام</div><div style="font-size:12px;color:#64748b;margin-top:6px">لن يتم حذف بياناتك أو ملف دخول الشركة.</div><button id="oscar-reload" style="margin-top:16px;border:0;border-radius:12px;background:#7C3AED;color:#fff;padding:11px 20px;font-weight:800">إعادة التحميل</button></div></div>';
      document.getElementById('oscar-reload')?.addEventListener('click', async () => {
        await clearCodeCaches();
        sessionStorage.removeItem('oscar-rootfix-retry');
        location.reload();
      });
    };

    const boot = async () => {
      // Local editors/localhost may still be controlled by a Service Worker from an older build.
      // Remove only code caches and the old worker once; never touch IndexedDB/company data.
      if (isLocal && 'serviceWorker' in navigator && navigator.serviceWorker.controller) {
        const localHealKey = 'oscar-local-sw-heal-' + OSCAR_BUILD;
        if (sessionStorage.getItem(localHealKey) !== '1') {
          sessionStorage.setItem(localHealKey, '1');
          try {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          } catch (_) {}
          try {
            if ('caches' in window) {
              const keys = await caches.keys();
              await Promise.all(keys.filter((key) => key.startsWith('oscar-accounting-')).map((key) => caches.delete(key)));
            }
          } catch (_) {}
          const url = new URL(location.href);
          url.searchParams.set('_oscar_local', Date.now().toString());
          location.replace(url.href);
          return;
        }
      }
      try {
        const markerKey = 'oscar-last-boot-build';
        const previous = localStorage.getItem(markerKey);
        if (previous !== OSCAR_BUILD) {
          // Do not destroy the previous PWA cache during an update. Keeping it lets
          // the program open immediately/offline while the new worker refreshes files.
          localStorage.setItem(markerKey, OSCAR_BUILD);
        }
      } catch (_) {}

      try {
        await import('./main.js?v=7.9.4.136-localization');
        sessionStorage.removeItem('oscar-rootfix-retry');
      } catch (error) {
        try { console.error('OSCAR_BOOT_RECOVERY', error); } catch (_) {}
        const retried = sessionStorage.getItem('oscar-rootfix-retry') === OSCAR_BUILD;
        if (!retried) {
          sessionStorage.setItem('oscar-rootfix-retry', OSCAR_BUILD);
          try { const registration = await navigator.serviceWorker?.getRegistration?.(); registration?.update?.(); } catch (_) {}
          const url = new URL(location.href);
          url.searchParams.set('_oscar_build', OSCAR_BUILD + '-' + Date.now());
          location.replace(url.href);
          return;
        }
        showRecovery();
      }
    };

    boot();
  </script>
  <script>
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !['localhost','127.0.0.1','::1'].includes(location.hostname)) {
      addEventListener('load', () => navigator.serviceWorker.register('./sw.js?v=7.9.4.136-localization', { updateViaCache: 'none' }).then((registration) => registration.update()).catch(() => {}));
    }
  </script>
</body>
</html>
